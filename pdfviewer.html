<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Viewer</title>
<style>
body { margin:0; padding:0; background:#eee; font-family:Arial; text-align:center; height:100vh; display:flex; flex-direction:column; }
h2 { margin: 15px 0; }
.pdf-container { flex: 1; width: 100%; max-width: 800px; margin: 0 auto 20px auto; background: white; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
iframe { width: 100%; height: 100%; border: none; }
</style>
</head>
<body>

<h2>📖 Notes Viewer</h2>

<div class="pdf-container">
    <iframe id="pdfFrame" src=""></div>
</div>

<script>
let urlParams = new URLSearchParams(window.location.search);
let pdfFile = urlParams.get("file");

if (pdfFile) {
    // This points directly to your pdf folder cleanly bypassing the browser security block
    document.getElementById("pdfFrame").src = "pdf/" + pdfFile;
} else {
    document.body.innerHTML = "<h2>No PDF file specified.</h2>";
}
</script>

</body>
</html>
