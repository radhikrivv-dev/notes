<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Viewer</title>
<style>
body{ margin:0; text-align:center; background:#eee; font-family:Arial; }
canvas{ max-width:100%; background:white; margin-top:10px; }
button{ padding:12px 20px; border:none; border-radius:20px; background:#1565C0; color:white; margin:10px; }
</style>
</head>
<body>

<h2>📖 Notes Viewer</h2>
<canvas id="pdfCanvas"></canvas>
<p id="pageNumber">Loading...</p>
<button onclick="previousPage()">⬅ Previous</button>
<button onclick="nextPage()">Next ➡</button>

<script src="https://cloudflare.com"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';

let urlParams = new URLSearchParams(window.location.search);
let pdfFile = urlParams.get("file");
let pdfUrl = "pdf/" + pdfFile;

let pdfDoc = null;
let pageNum = 1;
let canvas = document.getElementById("pdfCanvas");
let ctx = canvas.getContext("2d");

function renderPage(num){
    pdfDoc.getPage(num).then(function(page){
        let viewport = page.getViewport({scale:1.5});
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        page.render({ canvasContext:ctx, viewport:viewport });
        document.getElementById("pageNumber").innerHTML = "Page "+num+" / "+pdfDoc.numPages;
    });
}

pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf){
    pdfDoc = pdf;
    renderPage(pageNum);
}).catch(function(error){
    document.getElementById("pageNumber").innerHTML = "PDF not found: "+error;
});

function nextPage(){
    if(pageNum < pdfDoc.numPages){ pageNum++; renderPage(pageNum); }
}

function previousPage(){
    if(pageNum > 1){ pageNum--; renderPage(pageNum); }
}
</script>
</body>
</html>
