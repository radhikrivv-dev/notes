<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CTEVT Notes - Maintenance</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url("background.jpg") center/cover no-repeat;
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.65);
}


.container{
    position:relative;
    z-index:2;
    width:90%;
    max-width:450px;
    text-align:center;
    color:white;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    padding:35px;
    border-radius:25px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}


/* Animated gears */

.gear{
    font-size:70px;
    display:inline-block;
    animation:rotate 4s linear infinite;
}

.gear2{
    font-size:50px;
    display:inline-block;
    animation:rotateReverse 3s linear infinite;
}


@keyframes rotate{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

@keyframes rotateReverse{
    from{
        transform:rotate(360deg);
    }
    to{
        transform:rotate(0deg);
    }
}


h1{
    margin:20px 0 10px;
    font-size:32px;
}


p{
    font-size:17px;
}


#timer{

    margin:25px 0;
    font-size:35px;
    font-weight:bold;
    color:#FFD54F;

}


.loading{

    width:100%;
    height:10px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin-top:20px;

}


.bar{

    height:100%;
    width:40%;
    background:#42A5F5;
    animation:load 2s infinite;

}


@keyframes load{

    50%{
        width:90%;
    }

}


</style>

</head>


<body>


<div class="container">


<div>
<span class="gear">⚙️</span>
<span class="gear2">⚙️</span>
</div>


<h1>🚧 Website Under Maintenance</h1>

<p>
We are upgrading CTEVT Notes.
<br>
Please wait, we will be back soon.
</p>


<div id="timer">
02d 00h 00m 00s
</div>


<div class="loading">
<div class="bar"></div>
</div>


</div>



<script>


// Maintenance time: 2 days from now

const endTime = Date.now() + (2 * 24 * 60 * 60 * 1000);



setInterval(function(){


let now = Date.now();

let distance = endTime - now;



if(distance <= 0){

    window.location.href="index.html";

}



let days = Math.floor(distance/(1000*60*60*24));

let hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));

let minutes = Math.floor((distance%(1000*60*60))/(1000*60));

let seconds = Math.floor((distance%(1000*60))/1000);



document.getElementById("timer").innerHTML =

days+"d "+
hours+"h "+
minutes+"m "+
seconds+"s";



},1000);


</script>


</body>
  </html>
