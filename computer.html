<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Engineering</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fb;
padding:20px;
}

h1{
text-align:center;
color:#1565C0;
margin-bottom:25px;
}

.semesters{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
max-width:900px;
margin:auto;
}

.card{
background:#fff;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h2{
color:#1565C0;
margin-bottom:15px;
}

.card button{
background:#1565C0;
color:#fff;
border:none;
padding:12px 25px;
border-radius:25px;
cursor:pointer;
font-size:16px;
}

.home{
text-align:center;
margin-top:40px;
}

.home a{
text-decoration:none;
background:#1565C0;
color:#fff;
padding:12px 30px;
border-radius:25px;
}
</style>

</head>
<body>

<h1>💻 Computer Engineering</h1>

<div class="semesters">

<div class="card">
<h2>📘 1st Semester</h2>
<a href="#"><button>Open</button></a>
</div>

<div class="card">
<h2>📗 2nd Semester</h2>
<a href="#"><button>Open</button></a>
</div>

<div class="card">
<h2>📙 3rd Semester</h2>
<a href="#"><button>Open</button></a>
</div>

<div class="card">
<h2>📕 4th Semester</h2>
<a href="#"><button>Open</button></a>
</div>

<div class="card">
<h2>📔 5th Semester</h2>
<a href="#"><button>Open</button></a>
</div>

<div class="card">
<h2>📓 6th Semester</h2>
<a href="#"><button>Open</button></a>
</div>

</div>

<div class="home">
<a href="index.html">🏠 Back to Home</a>
</div>

</body>
</html>
